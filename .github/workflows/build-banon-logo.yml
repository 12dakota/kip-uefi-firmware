# BANON flavor: official MrChromebox Full ROM + optional HP mark.
# BANON = Acer Chromebook 15 CB3-532 (Braswell). Not SNAPPY. Not KIP.
name: BANON Full ROM + logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  banon-logo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-12 g++-12 zlib1g-dev openssl libssl-dev \
            pkg-config python-is-python3 git imagemagick wget flex bison
      - name: Official banon ROM
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36'
          BASE='https://www.mrchromebox.tech/files/firmware/full_rom'
          mkdir -p roms
          ok=
          for URL in \
            "$BASE/MrChromebox-2606.1/coreboot_edk2-banon-mrchromebox_20260714.rom" \
            "$BASE/coreboot_edk2-banon-mrchromebox_20260714.rom"
          do
            echo "GET $URL"
            if curl -fL --retry 3 -A "$UA" -o roms/banon.rom "$URL"; then ok=1; break; fi
          done
          test -n "$ok" && test -s roms/banon.rom
          cp roms/banon.rom banon-stock.rom
      - name: cbfstool
        run: |
          git clone --depth 1 https://github.com/coreboot/coreboot.git cb
          git -C cb submodule update --init --depth 1 3rdparty/vboot || true
          grep -rl -- '-std=gnu23' cb/util | xargs -r sed -i 's/-std=gnu23/-std=gnu17/g' || true
          make -C cb/util/cbfstool -j"$(nproc)" HOSTCC=gcc-12
          sudo cp cb/util/cbfstool/cbfstool /usr/local/bin/
      - name: Logo
        run: |
          set -euo pipefail
          NAME='Documentation/coreboot_logo.bmp'
          cp banon-stock.rom banon-logo.rom
          W=200; H=200
          if cbfstool banon-logo.rom extract -n "$NAME" -f old.bmp; then
            WH=$(identify -format '%w %h' old.bmp 2>/dev/null || true)
            if [ -n "$WH" ]; then W=$(echo "$WH" | awk '{print $1}'); H=$(echo "$WH" | awk '{print $2}'); fi
          fi
          if [ -f assets/acer-logo.png ]; then
            convert assets/acer-logo.png -resize "${W}x${H}" -background black \
              -gravity center -extent "${W}x${H}" -type TrueColor -define bmp:format=bmp3 splash.bmp
          else
            convert -size "${W}x${H}" xc:black -gravity center -fill white \
              -annotate 0 'acer' -type TrueColor -define bmp:format=bmp3 splash.bmp
          fi
          cbfstool banon-logo.rom remove -n "$NAME" || true
          cbfstool banon-logo.rom add -f splash.bmp -n "$NAME" -t raw
          test "$(stat -c '%s' banon-logo.rom)" -eq "$(stat -c '%s' banon-stock.rom)"
          echo "BANON flavor. Official payload. USB mouse in setup if UsbMouseDxe present." > README-BANON.txt
      - uses: actions/upload-artifact@v4
        with:
          name: banon-logo
          path: |
            banon-logo.rom
            banon-stock.rom
            README-BANON.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: banon-logo-${{ github.run_id }}
          prerelease: true
          name: BANON official Full ROM + logo
          body: Acer CB3-532 / BANON. Official MrChromebox payload. Not SNAPPY.
          files: |
            banon-logo.rom
            banon-stock.rom
            README-BANON.txt
