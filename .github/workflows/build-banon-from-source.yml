# BANON from-source MrChromebox coreboot + Acer splash/SMBIOS + Elan/SMBIOS DXE payload.
name: BANON from-source coreboot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential curl flex git gnat gcc-12 g++-12 \
            imagemagick libncurses5-dev m4 nasm python-is-python3 uuid-dev \
            zlib1g-dev libssl-dev pkg-config libcmocka-dev libnss3-dev \
            fonts-dejavu-core gcc-multilib iasl wget
          export PYTHON_COMMAND=python3
      - name: Clone MrChromebox coreboot
        run: |
          git clone --depth 50 https://github.com/MrChromebox/coreboot.git coreboot
          git -C coreboot fetch --tags --depth 50 || true
          git -C coreboot tag -f ci-banon "$(git -C coreboot rev-parse --short HEAD)" || true
          git -C coreboot submodule update --init --checkout --recursive --depth 1 || true
          grep -rl -- '-std=gnu23' coreboot | xargs -r sed -i 's/-std=gnu23/-std=gnu17/g' || true
          # MrChromebox chromeec -Werror format on this gcc
          python3 - <<'PY'
          from pathlib import Path
          p = Path("coreboot/src/ec/google/chromeec/ec_sync.c")
          if p.exists():
              t = p.read_text()
              t = t.replace("%lx", "%zd")
              p.write_text(t)
              print("patched ec_sync.c")
          PY
      - name: Acer splash
        run: |
          if [ -f assets/acer-logo.png ]; then
            convert assets/acer-logo.png -resize 200x200 -background black -gravity center \
              -extent 200x200 -type TrueColor -define bmp:format=bmp3 \
              coreboot/Documentation/coreboot_logo.bmp
          else
            convert -size 200x200 xc:black -gravity center -fill '#83B81A' -pointsize 36 \
              -annotate 0 'acer' -type TrueColor -define bmp:format=bmp3 \
              coreboot/Documentation/coreboot_logo.bmp
          fi
      - name: Patch banon SMBIOS
        run: |
          set -euo pipefail
          CFG=$(find coreboot -iname '*banon*' \( -name '*defconfig*' -o -name 'config*' \) | head -n1)
          echo "cfg=$CFG"
          test -n "$CFG"
          {
            echo 'CONFIG_ANY_TOOLCHAIN=y'
            echo 'CONFIG_MAINBOARD_SMBIOS_MANUFACTURER="Acer"'
            echo 'CONFIG_MAINBOARD_SMBIOS_PRODUCT_NAME="CB3-532"'
            echo 'CONFIG_LOCALVERSION="acer-elan"'
          } >> "$CFG"
      - name: UefiPayload with BANON DXEs
        run: |
          set -eo pipefail
          export PYTHON_COMMAND=python3
          git clone --depth 1 --recurse-submodules https://github.com/tianocore/edk2.git
          mkdir -p edk2/UefiPayloadPkg/BanonElanPointerDxe edk2/UefiPayloadPkg/BanonSmbiosDxe
          cp drivers/BanonElanPointerDxe/* edk2/UefiPayloadPkg/BanonElanPointerDxe/
          cp drivers/BanonSmbiosDxe/* edk2/UefiPayloadPkg/BanonSmbiosDxe/
          python3 - <<'PY'
          from pathlib import Path
          infs = [
            "UefiPayloadPkg/BanonSmbiosDxe/BanonSmbiosDxe.inf",
            "UefiPayloadPkg/BanonElanPointerDxe/BanonElanPointerDxe.inf",
          ]
          for name in ["UefiPayloadPkg.dsc", "UefiPayloadPkgIa32X64.dsc"]:
              p = Path("edk2/UefiPayloadPkg") / name
              if not p.exists():
                  continue
              t = p.read_text()
              extra = "".join("\n  " + i for i in infs if i not in t)
              if extra:
                  p.write_text(t.rstrip() + extra + "\n")
          for name in ["UefiPayloadPkg.fdf", "UefiPayloadPkgIa32X64.fdf"]:
              p = Path("edk2/UefiPayloadPkg") / name
              if not p.exists():
                  continue
              t = p.read_text()
              idx = t.rfind("INF  UefiPayloadPkg/")
              if idx < 0:
                  raise SystemExit("no INF")
              nl = t.find("\n", idx)
              add = "".join("INF  " + i + "\n" for i in infs if i not in t)
              p.write_text(t[:nl+1] + add + t[nl+1:])
          PY
          make -C edk2/BaseTools
          export WORKSPACE="$GITHUB_WORKSPACE/edk2"
          cd edk2
          . ./edksetup.sh
          DSC=UefiPayloadPkg/UefiPayloadPkg.dsc
          [ -f UefiPayloadPkg/UefiPayloadPkgIa32X64.dsc ] && DSC=UefiPayloadPkg/UefiPayloadPkgIa32X64.dsc
          build -a IA32 -a X64 -p "$DSC" -b RELEASE -t GCC5 -D BOOTLOADER=COREBOOT \
            || build -a IA32 -a X64 -p "$DSC" -b RELEASE -t GCC -D BOOTLOADER=COREBOOT
          FD=$(find Build -name 'UEFIPAYLOAD.fd' | head -n1)
          test -n "$FD"
          cp "$FD" "$GITHUB_WORKSPACE/UEFIPAYLOAD.fd"
      - name: build-uefi.sh banon
        run: |
          set -eo pipefail
          export PYTHON_COMMAND=python3
          mkdir -p "$HOME/dev/roms"
          cd coreboot
          ./build-uefi.sh banon || ./build-uefi.sh BANON
          ROM=$(ls -1 "$HOME/dev/roms"/*banon*.rom "$HOME/dev/roms"/*BANON*.rom \
            ./coreboot_edk2-banon*.rom build/coreboot.rom 2>/dev/null | head -n1)
          test -n "$ROM"
          cp "$ROM" "$GITHUB_WORKSPACE/banon-from-source.rom"
      - name: Splice DXE payload + keep splash
        run: |
          set -euo pipefail
          grep -rl -- '-std=gnu23' coreboot/util | xargs -r sed -i 's/-std=gnu23/-std=gnu17/g' || true
          make -C coreboot/util/cbfstool HOSTCC=gcc-12 || make -C coreboot/util/cbfstool
          STOCK=$(stat -c '%s' banon-from-source.rom)
          cbfstool=coreboot/util/cbfstool/cbfstool
          $cbfstool banon-from-source.rom remove -n fallback/payload || true
          $cbfstool banon-from-source.rom add-payload -n fallback/payload -f UEFIPAYLOAD.fd -c lzma
          test "$(stat -c '%s' banon-from-source.rom)" -eq "$STOCK"
          echo "BANON from-source coreboot. Acer SMBIOS Kconfig + splash. Payload has Elan+SMBIOS DXE." > README-BANON-SRC.txt
      - uses: actions/upload-artifact@v4
        with:
          name: banon-from-source
          path: |
            banon-from-source.rom
            README-BANON-SRC.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: banon-src-${{ github.run_id }}
          prerelease: true
          name: BANON from-source + Acer + Elan DXE
          body: MrChromebox coreboot rebuilt for banon. SMBIOS Acer/CB3-532. Acer splash. Payload includes BanonElanPointerDxe and BanonSmbiosDxe. Experimental.
          files: |
            banon-from-source.rom
            README-BANON-SRC.txt
