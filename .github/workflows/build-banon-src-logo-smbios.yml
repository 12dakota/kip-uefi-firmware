# BANON from-source: Acer splash + SMBIOS only. Official MrChromebox payload. No Elan DXE.
name: BANON src logo+SMBIOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential curl flex git gnat gcc-12 g++-12 \
            imagemagick libncurses5-dev m4 nasm python-is-python3 uuid-dev \
            zlib1g-dev libssl-dev pkg-config libcmocka-dev libnss3-dev \
            fonts-dejavu-core gcc-multilib iasl wget
      - name: Clone MrChromebox coreboot
        run: |
          git clone --depth 50 https://github.com/MrChromebox/coreboot.git coreboot
          git -C coreboot fetch --tags --depth 50 || true
          git -C coreboot tag -f ci-banon "$(git -C coreboot rev-parse --short HEAD)" || true
          git -C coreboot submodule update --init --checkout --recursive --depth 1 || true
          grep -rl -- '-std=gnu23' coreboot | xargs -r sed -i 's/-std=gnu23/-std=gnu17/g' || true
          python3 - <<'PY'
          from pathlib import Path
          p = Path("coreboot/src/ec/google/chromeec/ec_sync.c")
          if p.exists():
              p.write_text(p.read_text().replace("%lx", "%zd"))
          PY
      - name: Acer splash on black
        run: |
          convert assets/acer-logo.png -resize 180x80 -background black -gravity center \
            -extent 200x200 -type TrueColor -define bmp:format=bmp3 \
            coreboot/Documentation/coreboot_logo.bmp
      - name: SMBIOS Acer / CB3-532
        run: |
          set -euo pipefail
          CFG=$(find coreboot -iname '*banon*' \( -name '*defconfig*' -o -name 'config*' \) | head -n1)
          echo "cfg=$CFG"
          test -n "$CFG"
          {
            echo 'CONFIG_ANY_TOOLCHAIN=y'
            echo 'CONFIG_MAINBOARD_SMBIOS_MANUFACTURER="Acer"'
            echo 'CONFIG_MAINBOARD_SMBIOS_PRODUCT_NAME="CB3-532"'
            echo 'CONFIG_LOCALVERSION="acer"'
          } >> "$CFG"
      - name: build-uefi.sh banon
        run: |
          set +e
          export PYTHON_COMMAND=python3
          mkdir -p "$HOME/dev/roms"
          cd coreboot
          ./build-uefi.sh banon
          rc=$?
          echo "build-uefi rc=$rc"
          cd "$GITHUB_WORKSPACE"
          ROM=$(find coreboot/build coreboot "$HOME/dev/roms" -name 'coreboot.rom' -o -name '*banon*.rom' 2>/dev/null | head -n1)
          echo "ROM=$ROM"
          test -n "$ROM" && test -f "$ROM"
          cp "$ROM" banon-from-source.rom
          ls -l banon-from-source.rom
          echo "From-source BANON. Acer splash. SMBIOS Acer/CB3-532. Stock MrChromebox payload. No Elan DXE." > README-BANON-SRC.txt
      - uses: actions/upload-artifact@v4
        with:
          name: banon-from-source
          path: |
            banon-from-source.rom
            README-BANON-SRC.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: banon-src-${{ github.run_id }}
          prerelease: true
          name: BANON from-source Acer splash + SMBIOS
          body: Rebuilt MrChromebox coreboot for banon. Logo black Acer wordmark. SMBIOS manufacturer Acer, product CB3-532. Payload is stock MrChromebox EDK2. No touchpad DXE.
          files: |
            banon-from-source.rom
            README-BANON-SRC.txt
