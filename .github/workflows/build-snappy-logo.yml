# SNAPPY official Full ROM + bootsplash replace. Lab only.
# SNAPPY = Apollo Lake. Do not use kip payloads on this image.
name: SNAPPY Full ROM + logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snappy-logo:
    runs-on: ubuntu-22.04
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev openssl libssl-dev \
            pkg-config python-is-python3 git imagemagick wget fonts-dejavu-core
      - name: Fetch official snappy ROM
        run: |
          curl -fsSL -o download-fullrom.sh \
            https://raw.githubusercontent.com/MrChromebox/scripts/main/download-fullrom.sh
          chmod +x download-fullrom.sh
          bash download-fullrom.sh -o roms snappy || bash download-fullrom.sh -o roms SNAPPY
          ROM=$(find roms -type f -name '*.rom' | head -n1)
          test -n "$ROM"
          cp "$ROM" snappy-stock.rom
          ls -l snappy-stock.rom
      - name: Build cbfstool
        run: |
          git clone --depth 1 https://github.com/coreboot/coreboot.git cb
          git -C cb submodule update --init --depth 1 3rdparty/vboot
          make -C cb/util/cbfstool -j"$(nproc)"
          sudo cp cb/util/cbfstool/cbfstool /usr/local/bin/
      - name: Make splash BMP
        run: |
          # White wordmark on black, 800x600 BMP (coreboot splash-friendly)
          convert -size 800x600 xc:black -gravity center \
            -fill white -font DejaVu-Sans-Bold -pointsize 72 \
            -annotate 0 'HP' \
            -type TrueColor -define bmp:format=bmp3 splash.bmp
          ls -l splash.bmp
      - name: Replace splash in ROM
        run: |
          set -euo pipefail
          cp snappy-stock.rom snappy-logo.rom
          cbfstool snappy-logo.rom print
          for n in bootsplash.jpg bootsplash.bmp logo.bmp \
                   Documentation/coreboot_logo.bmp fallback/bootsplash \
                   splash.bmp splash.jpg; do
            cbfstool snappy-logo.rom remove -n "$n" && echo "removed $n" || true
          done
          # Prefer bootsplash.bmp if CBFS has room; ignore failure
          cbfstool snappy-logo.rom add -f splash.bmp -n bootsplash.bmp -t raw || \
          cbfstool snappy-logo.rom add -f splash.bmp -n bootsplash.jpg -t raw || \
            echo "WARN: could not add splash (layout full or name mismatch)"
          cbfstool snappy-logo.rom print
          echo "size=$(stat -c '%s' snappy-logo.rom)"
          test "$(stat -c '%s' snappy-logo.rom)" -eq "$(stat -c '%s' snappy-stock.rom)"
          echo "SNAPPY lab image. Prefer snappy-stock if splash replace looks wrong." > README-SNAPPY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: snappy-logo-EXPERIMENTAL
          path: |
            snappy-logo.rom
            snappy-stock.rom
            splash.bmp
            README-SNAPPY.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snappy-logo-${{ github.run_id }}
          name: SNAPPY Full ROM + splash (prerelease)
          prerelease: true
          generate_release_notes: false
          body: |
            Experimental SNAPPY (Apollo Lake) image.
            Official MrChromebox wrapper + bootsplash replace.
            Prefer snappy-stock.rom for daily use.
            Do not flash kip payloads on SNAPPY.
          files: |
            snappy-logo.rom
            snappy-stock.rom
            README-SNAPPY.txt
            splash.bmp
