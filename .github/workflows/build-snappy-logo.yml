# a304337 config: official SNAPPY Full ROM, payload untouched.
# Splash source is assets/hp-logo.png (user-provided mark).
name: SNAPPY Full ROM + logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snappy-logo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev openssl libssl-dev \
            pkg-config python-is-python3 git imagemagick wget
      - name: Fetch official snappy ROM
        run: |
          git clone --depth 1 https://github.com/MrChromebox/scripts.git mc-scripts
          bash mc-scripts/download-fullrom.sh -o roms snappy || bash mc-scripts/download-fullrom.sh -o roms SNAPPY
          ROM=$(find roms -type f -name '*.rom' | head -n1)
          test -n "$ROM"
          cp "$ROM" snappy-stock.rom
      - name: Build cbfstool
        run: |
          git clone --depth 1 https://github.com/coreboot/coreboot.git cb
          git -C cb submodule update --init --depth 1 3rdparty/vboot
          make -C cb/util/cbfstool -j"$(nproc)"
          sudo cp cb/util/cbfstool/cbfstool /usr/local/bin/
      - name: Replace Documentation/coreboot_logo.bmp with provided HP mark
        run: |
          set -euo pipefail
          test -f assets/hp-logo.png
          NAME='Documentation/coreboot_logo.bmp'
          cp snappy-stock.rom snappy-logo.rom
          cbfstool snappy-logo.rom print
          W=200; H=200
          if cbfstool snappy-logo.rom extract -n "$NAME" -f old_logo.bmp; then
            WH=$(identify -format '%w %h' old_logo.bmp 2>/dev/null || true)
            if [ -n "$WH" ]; then
              W=$(echo "$WH" | awk '{print $1}')
              H=$(echo "$WH" | awk '{print $2}')
            fi
          fi
          convert assets/hp-logo.png -resize "${W}x${H}" -background black \
            -gravity center -extent "${W}x${H}" \
            -type TrueColor -define bmp:format=bmp3 splash.bmp
          cbfstool snappy-logo.rom remove -n "$NAME" || true
          cbfstool snappy-logo.rom add -f splash.bmp -n "$NAME" -t raw
          cbfstool snappy-logo.rom print
          test "$(stat -c '%s' snappy-logo.rom)" -eq "$(stat -c '%s' snappy-stock.rom)"
          echo "a304337-style official payload. Only $NAME from assets/hp-logo.png." > README-SNAPPY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: snappy-logo-EXPERIMENTAL
          path: |
            snappy-logo.rom
            snappy-stock.rom
            splash.bmp
            README-SNAPPY.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: snappy-logo-${{ github.run_id }}
          name: SNAPPY a304337 + provided HP logo
          prerelease: true
          body: Official SNAPPY ROM like a304337. Only Documentation/coreboot_logo.bmp replaced with the provided HP mark. No SMBIOS patch.
          files: |
            snappy-logo.rom
            snappy-stock.rom
            splash.bmp
            README-SNAPPY.txt
