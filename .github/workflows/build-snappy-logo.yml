# a304337 behavior: official SNAPPY ROM + logo only.
# Replace ONLY Documentation/coreboot_logo.bmp (coreboot power-on mark).
name: SNAPPY Full ROM + logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snappy-logo:
    runs-on: ubuntu-22.04
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev openssl libssl-dev \
            pkg-config python-is-python3 git imagemagick wget fonts-dejavu-core
      - name: Fetch official snappy ROM
        run: |
          curl -fsSL -o download-fullrom.sh \
            https://raw.githubusercontent.com/MrChromebox/scripts/main/download-fullrom.sh
          chmod +x download-fullrom.sh
          bash download-fullrom.sh -o roms snappy || bash download-fullrom.sh -o roms SNAPPY
          ROM=$(find roms -type f -name '*.rom' | head -n1)
          test -n "$ROM"
          cp "$ROM" snappy-stock.rom
      - name: Build cbfstool
        run: |
          git clone --depth 1 https://github.com/coreboot/coreboot.git cb
          git -C cb submodule update --init --depth 1 3rdparty/vboot
          make -C cb/util/cbfstool -j"$(nproc)"
          sudo cp cb/util/cbfstool/cbfstool /usr/local/bin/
      - name: Replace Documentation/coreboot_logo.bmp only
        run: |
          set -euo pipefail
          NAME='Documentation/coreboot_logo.bmp'
          cp snappy-stock.rom snappy-logo.rom
          cbfstool snappy-logo.rom print
          W=200
          H=200
          if cbfstool snappy-logo.rom extract -n "$NAME" -f old_logo.bmp; then
            echo "extracted $NAME"
            identify old_logo.bmp || true
            WH=$(identify -format '%w %h' old_logo.bmp 2>/dev/null || true)
            if [ -n "$WH" ]; then
              W=$(echo "$WH" | awk '{print $1}')
              H=$(echo "$WH" | awk '{print $2}')
            fi
          else
            echo "stock has no $NAME; will add it"
          fi
          convert -size "${W}x${H}" xc:black -gravity center \
            -fill white -font DejaVu-Sans-Bold -pointsize $((W/4)) \
            -annotate 0 'HP' \
            -type TrueColor -define bmp:format=bmp3 splash.bmp
          cbfstool snappy-logo.rom remove -n "$NAME" || true
          cbfstool snappy-logo.rom add -f splash.bmp -n "$NAME" -t raw
          cbfstool snappy-logo.rom print
          test "$(stat -c '%s' snappy-logo.rom)" -eq "$(stat -c '%s' snappy-stock.rom)"
          python3 - <<'PY'
          path = "snappy-logo.rom"
          data = bytearray(open(path, "rb").read())

          def repl_cstr(old: bytes, new: bytes, limit: int = 8) -> int:
              needle = old + b"\x00"
              if data.count(needle) > 32:
                  print(f"skip {old!r}: too many hits ({data.count(needle)})")
                  return 0
              if len(new) > len(old):
                  print(f"skip {old!r}: new string longer")
                  return 0
              padded = new + b"\x00" * (len(old) - len(new))
              n = 0
              start = 0
              while n < limit:
                  i = data.find(needle, start)
                  if i < 0:
                      break
                  data[i:i + len(old)] = padded
                  n += 1
                  start = i + len(needle)
              print(f"cstr {old!r} -> {new!r} x{n}")
              return n

          repl_cstr(b"Google", b"HP")
          product = b"HP Chromebook 14 G5"
          for old in (b"Google Snappy", b"HP Chromebook 14 G5"):
              pass
          for old in (b"Google Snappy",):
              if len(old) >= len(product):
                  repl_cstr(old, product)
              else:
                  print(f"cannot fit product into {old!r}")
          # Snappy is too short for full 14 G5 name
          print("Snappy slot too short for 'HP Chromebook 14 G5'; manufacturer only if Google\\0 found")
          open(path, "wb").write(data)
          PY
          echo "Logo + limited C-string SMBIOS. Payload unchanged." > README-SNAPPY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: snappy-logo-EXPERIMENTAL
          path: |
            snappy-logo.rom
            snappy-stock.rom
            splash.bmp
            README-SNAPPY.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snappy-logo-${{ github.run_id }}
          name: SNAPPY Documentation/coreboot_logo.bmp HP
          prerelease: true
          body: |
            Official SNAPPY Full ROM. Only CBFS file
            Documentation/coreboot_logo.bmp replaced with HP BMP.
            Payload unchanged. Daily: snappy-stock.rom.
          files: |
            snappy-logo.rom
            snappy-stock.rom
            README-SNAPPY.txt
            splash.bmp
