# SNAPPY: official MrChromebox ROM + COREBOOT UefiPayload (Mu on PACKAGES_PATH).
# microsoft/mu_tianocore_platforms does not exist; do not stuart CorebootPayloadPkg.
name: Build Project Mu UEFI for Snappy Chromebook

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3 \
            python-is-python3 gcc-multilib uuid-runtime zlib1g-dev openssl \
            libssl-dev pkg-config git
      - name: Official snappy Full ROM
        run: |
          curl -fsSL -o download-fullrom.sh \
            https://raw.githubusercontent.com/MrChromebox/scripts/main/download-fullrom.sh
          chmod +x download-fullrom.sh
          bash download-fullrom.sh -o roms snappy || bash download-fullrom.sh -o roms SNAPPY
          ROM=$(find roms -type f -name '*.rom' | head -n1)
          test -n "$ROM"
          cp "$ROM" snappy-stock.rom
      - name: Clone Mu + tianocore UefiPayloadPkg
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/microsoft/mu_basecore.git
          git clone --depth 1 --recurse-submodules https://github.com/microsoft/mu_plus.git
          git clone --depth 1 --recurse-submodules https://github.com/microsoft/mu_tiano_plus.git
          git clone --depth 1 --recurse-submodules https://github.com/tianocore/edk2.git
      - name: Build UEFIPAYLOAD.fd
        run: |
          make -C edk2/BaseTools
          export PACKAGES_PATH="$GITHUB_WORKSPACE/mu_basecore:$GITHUB_WORKSPACE/mu_plus:$GITHUB_WORKSPACE/mu_tiano_plus:$GITHUB_WORKSPACE/edk2"
          export WORKSPACE="$GITHUB_WORKSPACE/edk2"
          cd edk2
          . ./edksetup.sh
          DSC=UefiPayloadPkg/UefiPayloadPkgIa32X64.dsc
          if [ ! -f "$DSC" ]; then DSC=UefiPayloadPkg/UefiPayloadPkg.dsc; fi
          build -a IA32 -a X64 -p "$DSC" -b RELEASE -t GCC -D BOOTLOADER=COREBOOT \
            || build -a IA32 -a X64 -p "$DSC" -b RELEASE -t GCC5 -D BOOTLOADER=COREBOOT
          FD=$(find Build -name 'UEFIPAYLOAD.fd' | head -n1)
          test -n "$FD"
          cp "$FD" "$GITHUB_WORKSPACE/UEFIPAYLOAD.fd"
      - name: cbfstool + splice
        run: |
          git clone --depth 1 https://github.com/coreboot/coreboot.git cb
          git -C cb submodule update --init --depth 1 3rdparty/vboot
          make -C cb/util/cbfstool -j"$(nproc)"
          sudo cp cb/util/cbfstool/cbfstool /usr/local/bin/
          STOCK=$(stat -c '%s' snappy-stock.rom)
          cp snappy-stock.rom EXPERIMENTAL-snappy-coreboot-mu.rom
          cbfstool EXPERIMENTAL-snappy-coreboot-mu.rom remove -n fallback/payload || true
          cbfstool EXPERIMENTAL-snappy-coreboot-mu.rom add-payload \
            -n fallback/payload -f UEFIPAYLOAD.fd -c lzma
          test "$(stat -c '%s' EXPERIMENTAL-snappy-coreboot-mu.rom)" -eq "$STOCK"
      - uses: actions/upload-artifact@v4
        with:
          name: snappy-mu-splice
          path: |
            EXPERIMENTAL-snappy-coreboot-mu.rom
            snappy-stock.rom
            UEFIPAYLOAD.fd
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: snappy-mu-${{ github.run_id }}
          name: SNAPPY Mu-path payload splice (prerelease)
          prerelease: true
          files: |
            EXPERIMENTAL-snappy-coreboot-mu.rom
            snappy-stock.rom
          body: Official SNAPPY wrapper + tianocore UefiPayload (Mu PACKAGES_PATH). Not FrontPage.
