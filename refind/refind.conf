# Dark, simple picker. Not MSI Click BIOS. Lives on the ESP, not in SPI.
timeout 8
use_nvram false
use_graphics_for osx,linux,windows
resolution max
showtools shutdown,reboot,firmware,about
scanfor manual,internal,external,optical
dont_scan_volumes "Recovery"
mouse_speed 4
enable_touch
enable_mouse

menuentry "Windows" {
    icon /EFI/refind/icons/os_win8.png
    loader /EFI/Microsoft/Boot/bootmgfw.efi
}
menuentry "Firmware setup" {
    icon /EFI/refind/icons/func_firmware.png
    firmware_setup
}
